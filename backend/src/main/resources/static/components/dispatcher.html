<div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-amber-700 flex items-center gap-2">
            <span>🎧</span> Emergency Call Center Intake Console
        </h2>
        <div class="flex items-center space-x-3">
            <div id="dispatcherAuthBadge" class="text-xs text-slate-500 font-medium">Not Logged In</div>
            <button id="btnDispatcherLogout" class="hidden text-xs bg-red-100 hover:bg-red-200 text-red-700 px-2.5 py-1 rounded font-semibold transition">
                Log Out
            </button>
        </div>
    </div>

    <!-- Dispatcher Login -->
    <div id="dispatcherLoginBox" class="p-4 bg-amber-50 border border-amber-200 rounded-lg mb-6 flex flex-wrap gap-3 items-end">
        <div class="flex-1 min-w-[200px]">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Dispatcher Email</label>
            <input type="email" id="dispatcherEmail" value="peter.dispatcher@example.com" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <div class="flex-1 min-w-[200px]">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
            <input type="password" id="dispatcherPassword" value="DispatcherPassword123!" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <button id="btnDispatcherLogin" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded text-sm font-semibold transition">Log In as Dispatcher</button>
    </div>

    <!-- Phone Dispatch Form -->
    <form id="phoneDispatchForm" class="space-y-4 max-w-2xl">
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label for="callContactName" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Caller Name</label>
                <input type="text" id="callContactName" required placeholder="Bystander or Relative" class="w-full border rounded px-3 py-2 text-sm">
            </div>
            <div>
                <label for="callContactPhone" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Inbound Phone Number</label>
                <input type="tel" id="callContactPhone" required placeholder="+1999888777" class="w-full border rounded px-3 py-2 text-sm">
            </div>
        </div>
        <div>
            <label for="callPickupAddress" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Incident Address</label>
            <input type="text" id="callPickupAddress" required placeholder="Highway Junction 4, Mile Marker 12" class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label for="callNotes" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Triage Operator Notes</label>
            <textarea id="callNotes" required rows="2" placeholder="Unconscious individual, severe bleeding reported by caller." class="w-full border rounded px-3 py-2 text-sm"></textarea>
        </div>
        <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-6 rounded-lg text-sm shadow transition">
            Log Phone Dispatch Booking
        </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-200 space-y-4">
        <div class="flex justify-between items-center gap-3 flex-wrap">
            <div>
                <h3 class="font-bold text-slate-800">Open Dispatch Queue</h3>
                <p class="text-xs text-slate-500">Optionally reserve a requested case for a specific available driver before that driver accepts it.</p>
            </div>
            <button id="btnRefreshDispatchAssignments" type="button" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded font-medium">
                Refresh Queue
            </button>
        </div>

        <div id="dispatchAssignmentList" class="space-y-3">
            <p class="text-sm text-slate-500 italic">Log in to view open dispatch cases and assign drivers.</p>
        </div>
    </div>
</div>
