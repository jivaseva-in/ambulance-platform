<div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-purple-700 flex items-center gap-2">
            <span>🛡️</span> User Administration Panel
        </h2>
        <div id="adminPanelAuthInfo" class="flex items-center gap-2 text-sm">
            <span id="adminPanelAuthBadge" class="px-2 py-1 rounded-full bg-slate-100 text-slate-700 font-medium">Not logged in</span>
            <button id="btnAdminPanelLogout" type="button" class="hidden px-3 py-1.5 rounded bg-purple-700 hover:bg-purple-800 text-white font-semibold transition">
                Logout
            </button>
        </div>
    </div>

    <!-- Login required message -->
    <div id="adminPanelLoginRequired" class="text-center p-8 bg-purple-50 rounded-lg space-y-4">
        <div>
            <p class="font-semibold text-purple-800">You must be logged in as an ADMIN or SUPER_ADMIN to access this panel.</p>
            <p class="text-sm text-slate-600 mt-1">Use your administrator credentials to sign in here.</p>
        </div>

        <form id="adminPanelLoginForm" class="max-w-sm mx-auto space-y-3 text-left">
            <div>
                <label for="adminPanelEmail" class="block text-sm font-medium text-slate-700 mb-1">Email or Username</label>
                <input id="adminPanelEmail" type="text" autocomplete="username" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="admin@example.com" required>
            </div>
            <div>
                <label for="adminPanelPassword" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input id="adminPanelPassword" type="password" autocomplete="current-password" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="••••••••" required>
            </div>
            <button id="btnAdminPanelLogin" type="submit" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-semibold px-4 py-2.5 rounded-lg transition">
                Login as Admin
            </button>
        </form>
    </div>

    <!-- Admin content area (hidden by default) -->
    <div id="adminPanelContent" class="hidden space-y-6">
        <!-- Pending Approvals Section -->
        <div>
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-slate-700">Pending User Approvals</h3>
                <button id="btnRefreshPendingUsers" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded font-medium">Refresh</button>
            </div>
            <div id="pending-users-list" class="space-y-2 border rounded-lg p-2 bg-slate-50 min-h-[50px]">
                <!-- Pending users will be dynamically inserted here -->
            </div>
        </div>

        <!-- Managed Staff Section -->
        <div id="super-admin-section" class="hidden pt-4 border-t">
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-slate-700">Managed Staff Accounts</h3>
                <button id="btnRefreshAllUsers" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded font-medium">Refresh</button>
            </div>
            <div id="all-users-list" class="space-y-2 border rounded-lg p-2 bg-slate-50 min-h-[50px]">
                <!-- Manageable staff users will be dynamically inserted here -->
            </div>
        </div>
    </div>
</div>
