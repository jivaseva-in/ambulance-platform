<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ambulance Dispatch & Tracking</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #mapPicker, #trackingMap { height: 280px; width: 100%; border-radius: 0.5rem; z-index: 10; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

<!-- Global Sticky Header -->
<header class="bg-rose-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🚑</span>
            <div>
                <h1 class="text-xl font-bold tracking-wide">Smart Ambulance Portal</h1>
                <p class="text-xs text-rose-100">Rapid Emergency Dispatch & Real-Time Tracking</p>
            </div>
        </div>
        <nav class="flex items-center space-x-2">
            <button id="navEmergency" class="px-3 py-1.5 bg-white text-rose-700 font-semibold rounded text-sm shadow hover:bg-rose-50 transition">Emergency</button>
            <button id="navRegister" class="px-3 py-1.5 bg-emerald-700 text-white font-semibold rounded text-sm hover:bg-emerald-800 transition">Register</button>
            <button id="navDriver" class="px-3 py-1.5 bg-rose-800 text-white font-semibold rounded text-sm hover:bg-rose-900 transition">Driver Portal</button>
            <button id="navDispatcher" class="px-3 py-1.5 bg-rose-800 text-white font-semibold rounded text-sm hover:bg-rose-900 transition">Dispatcher</button>
            <button id="navAdmin" class="px-3 py-1.5 bg-purple-800 text-white font-semibold rounded text-sm hover:bg-purple-900 transition">Admin</button>
        </nav>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4 space-y-6">
    <!-- Notification Banner -->
    <div id="alertBox" class="hidden p-4 rounded-md text-sm font-medium transition-all"></div>

    <!-- Modular Views (Injected Dynamically from /components/*.html) -->
    <section id="viewEmergency" class="grid grid-cols-1 md:grid-cols-2 gap-6" data-src="/components/emergency.html"></section>
    <section id="viewRegister" class="hidden max-w-3xl mx-auto w-full" data-src="/components/register.html"></section>
    <section id="viewDriver" class="hidden space-y-6" data-src="/components/driver.html"></section>
    <section id="viewDispatcher" class="hidden space-y-6" data-src="/components/dispatcher.html"></section>
    <section id="viewAdmin" class="hidden space-y-6" data-src="/components/admin.html"></section>
</main>

<!-- Master Modular Orchestrator -->
<script type="module" src="/js/app.js"></script>
</body>
</html>
